[tools]
python = "3.14"
uv = "latest"

[tasks.install]
description = "Install docs dependencies"
run = "uv sync --quiet"

[tasks.start]
description = "Serve docs with live reload"
depends = ["install"]
run = "uv run sphinx-autobuild docs build/html --open-browser"

[tasks.build]
description = "Build HTML docs"
depends = ["install"]
run = "uv run sphinx-build -W --keep-going -b html docs build/html"

[tasks.pdf]
description = "Build PDF docs (requires LaTeX)"
depends = ["install"]
run = "uv run sphinx-build -M latexpdf docs build"
